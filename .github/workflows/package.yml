name: Package

on:
  pull_request:
    # no branch filter: stacked PRs don't target main, but should still prove the bundle builds
    paths:
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/package.yml"
  workflow_call:
    inputs:
      version:
        description: "Version to build"
        default: "0.0.0"
        required: false
        type: string

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            bundle: dmg
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # tauri.conf.json reads its version from package.json
      - name: Change version
        if: ${{ inputs.version }}
        run: pnpm version ${{ inputs.version }} --no-git-tag-version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build app
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.bundle }}-${{ inputs.version || 'latest' }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
