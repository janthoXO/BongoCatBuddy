name: Package

on:
  pull_request:
    # no branch filter: stacked PRs don't target main, but should still prove the bundle builds
    paths:
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/package.yml"
  workflow_call:
    inputs:
      version:
        description: "Version to build"
        default: "0.0.0"
        required: false
        type: string

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            bundle: dmg
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # tauri.conf.json reads its version from package.json
      - name: Change version
        if: ${{ inputs.version }}
        run: pnpm version ${{ inputs.version }} --no-git-tag-version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same self-signed cert every release, so macOS keeps Input Monitoring across updates
      # (ad-hoc signing ties it to the build hash). No secret (fork PRs): stays ad-hoc.
      - name: Import signing cert
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [ -n "$MACOS_CERT_P12" ] || exit 0
          KC="$RUNNER_TEMP/sign.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=BongoCatBuddy" >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.bundle }}-${{ inputs.version || 'latest' }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
