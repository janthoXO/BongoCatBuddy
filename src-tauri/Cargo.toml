[package]
name = "bongo-cat-buddy"
version = "0.1.0"
description = "BongoCatBuddy"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bongo_cat_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
steamworks = "0.13.1"
# raw bindings for ISteamInventory, which the steamworks crate doesn't wrap
steamworks-sys = "0.13.0"
png = "0.18.1"
# fork fixes macOS crashes of rdev 0.5.3 (same one ayangweb BongoCat uses)
rdev = { git = "https://github.com/kunkunsh/rdev", rev = "cb9a29e19668a52e4e67d8a0ca6739c1807f8d3f" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
